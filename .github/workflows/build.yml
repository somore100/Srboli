name: Build Srboli

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:

  windows:
    name: Windows Build
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build
        run: |
          pyinstaller SrboliLight.spec

      - uses: actions/upload-artifact@v4
        with:
          name: Srboli-Windows
          path: dist/


  linux:
    name: Linux AppImage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y fuse libfuse2
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build
        run: |
          pyinstaller srboli.spec

      - name: Prepare AppImage
        run: |
          mkdir -p Srboli.AppDir/usr/bin
          cp -r dist/Srboli/* Srboli.AppDir/usr/bin/

          cp logo.png Srboli.AppDir/

          cat > Srboli.AppDir/Srboli.desktop <<EOF
          [Desktop Entry]
          Name=Srboli
          Exec=Srboli
          Icon=logo
          Type=Application
          Categories=Utility;
          EOF

          ln -s usr/bin/Srboli Srboli.AppDir/AppRun

      - name: Build AppImage
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ./appimagetool-x86_64.AppImage Srboli.AppDir Srboli.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: Srboli-Linux-AppImage
          path: Srboli.AppImage

  macos:
    name: macOS Build
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build
        run: |
          pyinstaller srboli.spec

      - uses: actions/upload-artifact@v4
        with:
          name: Srboli-macOS
          path: dist/
