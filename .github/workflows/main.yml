name: Build Srboli

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:

  windows:
    name: Windows Build
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build
        run: |
          pyinstaller SrboliLight.spec

      - uses: actions/upload-artifact@v4
        with:
          name: Srboli-Windows
          path: dist/


  linux:
    name: Linux AppImage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y fuse libfuse2
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build
        run: |
          pyinstaller srboli.spec

      - name: Create AppImage
        run: |
          mkdir AppDir
          cp -r dist/* AppDir/

      - uses: actions/upload-artifact@v4
        with:
          name: Srboli-Linux
          path: AppDir/


  macos:
    name: macOS Build
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build
        run: |
          pyinstaller srboli.spec

      - uses: actions/upload-artifact@v4
        with:
          name: Srboli-macOS
          path: dist/
