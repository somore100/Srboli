name: Build Srboli
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.10"

jobs:
  windows:
    name: Windows EXE
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-desktop.txt
          pip install pyinstaller
      - name: Build EXE
        env:
          KIVY_GL_BACKEND: angle_sdl2
        run: |
          pyinstaller srboli.spec --clean
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Srboli-Windows
          path: dist/

  linux:
    name: Linux AppImage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install system packages
        run: |
          sudo apt update
          sudo apt install -y fuse libfuse2 xvfb libmtdev1 libgl1-mesa-dev
          pip install -r requirements-desktop.txt
          pip install pyinstaller
      - name: Build
        env:
          KIVY_NO_ARGS: "1"
          KIVY_NO_CONSOLELOG: "1"
        run: |
          xvfb-run -a pyinstaller srboli.spec
      - name: Prepare AppImage
        run: |
          mkdir -p Srboli.AppDir/usr/bin
          cp -r dist/Srboli/* Srboli.AppDir/usr/bin/
          cp logo.png Srboli.AppDir/
          cat > Srboli.AppDir/Srboli.desktop <<EOF
          [Desktop Entry]
          Name=Srboli
          Exec=Srboli
          Icon=logo
          Type=Application
          Categories=Utility;
          EOF
          ln -s usr/bin/Srboli Srboli.AppDir/AppRun
      - name: Build AppImage
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ./appimagetool-x86_64.AppImage Srboli.AppDir Srboli.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: Srboli-Linux-AppImage
          path: Srboli.AppImage

  macos:
    name: macOS App
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-desktop.txt
          pip install pyinstaller
      - name: Build
        run: |
          pyinstaller srboli.spec --clean
      - name: Upload macOS build
        uses: actions/upload-artifact@v4
        with:
          name: Srboli-macOS
          path: dist/

  android:
    name: Android APK
    # Pinned OS: the kivy/buildozer "latest" Docker image moved to Ubuntu 26.04
    # (CMake 4.x, which rejects libjpeg-turbo 2.0.1's cmake_minimum_required),
    # and p4a v2024.01.21 predates that toolchain. Building directly on a
    # pinned runner with pinned tools keeps this reproducible.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Purge stray requirements files
        run: |
          find . -name "requirements.txt" -type f -delete

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake build-essential ccache gettext git libffi-dev \
            libltdl-dev libssl-dev libtool patch pkg-config unzip zip zlib1g-dev

      - name: Install buildozer and pinned CMake
        run: |
          python -m pip install --upgrade pip wheel
          pip install "Cython<3.0" buildozer
          # CMake 4.x removed compatibility with cmake_minimum_required < 3.5,
          # which old recipes (jpeg 2.0.1) still use.
          pip install "cmake<4"
          cmake --version
          which cmake

      - name: Cache buildozer state
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
          key: buildozer-v5-${{ hashFiles('buildozer.spec') }}

      - name: Build APK
        run: |
          set -o pipefail
          # Source downloads (python.org, GitHub, etc.) occasionally return
          # transient 5xx errors. Retry; already-downloaded/built pieces
          # under .buildozer are reused, so retries are cheap.
          : > buildozer-full.log
          for attempt in 1 2 3; do
            echo "=== buildozer attempt $attempt ===" | tee -a buildozer-full.log
            if buildozer -v android debug 2>&1 | tee -a buildozer-full.log; then
              exit 0
            fi
            echo "=== attempt $attempt failed ===" | tee -a buildozer-full.log
            sleep 30
          done
          exit 1

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-log
          path: buildozer-full.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Srboli-Android-APK
          path: bin/*.apk
