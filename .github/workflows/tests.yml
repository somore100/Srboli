name: Tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: Core tests (no Kivy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - run: pytest -m "not display" -q
